name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run Ruff & Mypy
        run: |
          uv run ruff check .
          uv run mypy src tests
      - name: Run Pytest
        run: uv run pytest
